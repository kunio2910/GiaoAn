<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fbff" />
    <title>Kế hoạch giáo dục cá nhân</title>
    <link rel="stylesheet" href="github-pages.css" />
  </head>
  <body>
    <svg class="svg-sprite" aria-hidden="true">
      <symbol id="icon-plan" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16M8 7h8M8 11h8M8 15h5"/></symbol>
      <symbol id="icon-children" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0M17.5 7.8a2.2 2.2 0 1 1 0 4.4M15.5 16.8a4.2 4.2 0 0 1 5 3.2"/></symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-2.6V20a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1-1.8-1.8.1-.1A1.7 1.7 0 0 0 8 15a1.7 1.7 0 0 0-1.6-1H6v-2.6h.4A1.7 1.7 0 0 0 8 10a1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.8-1.8.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6v-.2H15v.2a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2V14h-.2a1.7 1.7 0 0 0-1.6 1z"/></symbol>
      <symbol id="icon-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><path d="m16.5 7.5 3-3M19.5 4.5v3h-3"/></symbol>
      <symbol id="icon-note" viewBox="0 0 24 24"><path d="M4.5 5h15v11H10l-4.5 4V5z"/><path d="M8 9h8M8 12h5"/></symbol>
      <symbol id="icon-file" viewBox="0 0 24 24"><path d="M6 3.5h8l4 4V20.5H6z"/><path d="M14 3.5v5h4M9 13h6M9 16h6"/></symbol>
      <symbol id="icon-group" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0M17.2 8.2a2.3 2.3 0 1 1 0 4.6M15.6 16.5a4.4 4.4 0 0 1 5 3.5"/></symbol>
      <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.5"/></symbol>
      <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m7 9 5 5 5-5"/></symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="icon-edit" viewBox="0 0 24 24"><path d="M4 16.5V20h3.5L18.8 8.7a2.1 2.1 0 0 0-3-3zM14.5 7.5l2 2"/></symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v5M14 11v5M6.5 7 7.3 20h9.4L17.5 7M9 7V4h6v3"/></symbol>
      <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M7 3v4M17 3v4M3.5 9h17"/></symbol>
      <symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20a7 7 0 0 1 14 0"/></symbol>
      <symbol id="icon-save" viewBox="0 0 24 24"><path d="M5 4h12l2 2v14H5zM8 4v5h8V4M8 20v-6h8v6"/></symbol>
      <symbol id="icon-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    </svg>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><div class="brand-mark"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><span>KẾ HOẠCH<br />GIÁO DỤC</span></div>
        <nav class="side-nav" aria-label="Điều hướng chính">
          <button class="nav-item active" data-view="plan"><span class="nav-icon"><svg><use href="#icon-plan"/></svg></span>Kế hoạch giáo dục</button>
          <button class="nav-item" data-view="objective"><span class="nav-icon"><svg><use href="#icon-target"/></svg></span>Thêm mục tiêu</button>
          <button class="nav-item" data-view="children"><span class="nav-icon"><svg><use href="#icon-children"/></svg></span>Hồ sơ trẻ</button>
          <button class="nav-item" data-view="settings"><span class="nav-icon"><svg><use href="#icon-settings"/></svg></span>Cài đặt</button>
        </nav>
        <div class="sidebar-art"></div>
        <div class="profile-card"><div class="teacher-avatar">VK</div><div><strong>Nguyễn Thị Vành Khuyên</strong><small>Người lập kế hoạch</small></div><button class="logout" type="button">Đăng xuất</button></div>
      </aside>
      <main class="main-content">
        <section class="screen active" id="screen-plan"></section>
        <section class="screen" id="screen-children"></section>
        <section class="screen" id="screen-objective"></section>
        <section class="screen" id="screen-settings"></section>
      </main>
    </div>
    <div class="modal-backdrop" id="child-modal" hidden><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="child-modal-title"><div class="modal-head"><div><h2 id="child-modal-title">Thêm trẻ mới</h2><p>Nhập thông tin để quản lý mục tiêu riêng cho trẻ.</p></div><button class="close-button" data-action="close-child" type="button" aria-label="Đóng">×</button></div><form id="child-form"><input type="hidden" id="child-id" /><div class="form-grid"><label class="field"><span>Họ và tên trẻ <em>*</em></span><input id="child-name" required placeholder="Ví dụ: Nguyễn Minh Anh" /></label><label class="field"><span>Ngày sinh <em>*</em></span><input id="child-birthday" required placeholder="dd/mm/yyyy" /></label><label class="field"><span>Giới tính</span><div class="select-wrap"><select id="child-gender"><option>Nữ</option><option>Nam</option><option>Khác</option></select><svg><use href="#icon-chevron"/></svg></div></label><label class="field full"><span>Ghi chú</span><textarea id="child-note" placeholder="Thông tin cần lưu ý về trẻ..."></textarea></label></div><div class="modal-actions"><button class="button" data-action="close-child" type="button">Hủy</button><button class="button primary" type="submit"><svg><use href="#icon-save"/></svg>Lưu hồ sơ</button></div></form></div></div>
    <div class="modal-backdrop" id="note-modal" hidden><div class="modal-card note-modal-card" role="dialog" aria-modal="true" aria-labelledby="note-modal-title"><div class="modal-head"><div><h2 id="note-modal-title">Ghi chú mục tiêu</h2><p>Nhập ghi chú cho mục tiêu đang theo dõi.</p></div><button class="close-button" data-action="close-note" type="button" aria-label="Đóng">×</button></div><form id="note-form"><input type="hidden" id="note-goal-id" /><label class="field"><span>Ghi chú</span><textarea id="note-text" placeholder="Nhập ghi chú..."></textarea></label><div class="modal-actions"><button class="button" data-action="close-note" type="button">Hủy</button><button class="button primary" type="submit">OK</button></div></form></div></div>
    <script src="github-pages.js"></script>
  </body>
</html>
